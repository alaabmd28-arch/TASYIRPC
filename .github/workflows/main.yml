# .github/workflows/desktop-build.yml
# يجد مشروع الحاسوب تلقائيًا (أي package.json فيه electron-builder أو main.js بجانب lib/ و app/).
# إن لم يوجد المشروع في هذا المستودع تُتخطى الخطوات بتحذير واضح ولا يفشل التشغيل.
name: Desktop build (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Locate project
        run: |
          PROJ=""
          for f in $(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*'); do
            d=$(dirname "$f")
            if grep -q 'electron' "$f" && [ -f "$d/main.js" ]; then PROJ="$d"; break; fi
          done
          if [ -z "$PROJ" ]; then
            echo "::warning::Desktop project (package.json with electron + main.js) not found in this repo - skipping."
            echo "FOUND=false" >> "$GITHUB_ENV"
          else
            echo "FOUND=true" >> "$GITHUB_ENV"
            echo "PROJ=$PROJ" >> "$GITHUB_ENV"
            echo "Project: $PROJ"
          fi
      - name: Unit tests (no dependencies needed)
        if: env.FOUND == 'true'
        working-directory: ${{ env.PROJ }}
        run: |
          [ -f tests/lib.test.js ] && node tests/lib.test.js || echo "no lib test"
          [ -f tests/sync.test.js ] && node tests/sync.test.js || echo "no sync test"

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Locate project
        run: |
          PROJ=""
          for f in $(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*'); do
            d=$(dirname "$f")
            if grep -q 'electron' "$f" && [ -f "$d/main.js" ]; then PROJ="$d"; break; fi
          done
          if [ -z "$PROJ" ]; then
            echo "::warning::Desktop project not found - skipping."
            echo "FOUND=false" >> "$GITHUB_ENV"
          else
            echo "FOUND=true" >> "$GITHUB_ENV"
            echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          fi
      - name: Install
        if: env.FOUND == 'true'
        working-directory: ${{ env.PROJ }}
        run: npm install --no-audit --no-fund
      - name: Build installer + portable
        if: env.FOUND == 'true'
        working-directory: ${{ env.PROJ }}
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        if: env.FOUND == 'true'
        with:
          name: Tasyir-Desktop-Windows
          path: ${{ env.PROJ }}/dist/*.exe
          if-no-files-found: error
      - name: Publish release (tags only)
        if: env.FOUND == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJ }}/dist/*.exe
