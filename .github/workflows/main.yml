# ضعه في جذر المستودع: .github/workflows/desktop-build.yml
# يجد مجلد المشروع تلقائيًا (حيث يوجد package.json الخاص بـ tasyir-bmd-desktop) حتى لو كان داخل مجلد فرعي.
name: Desktop build (Windows)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Locate project
        run: |
          f=$(grep -l '"name": *"tasyir-bmd-desktop"' $(find . -name package.json -not -path '*/node_modules/*') | head -1)
          [ -n "$f" ] || { echo "::error::package.json (tasyir-bmd-desktop) not found in repo"; find . -maxdepth 3 -not -path './.git/*' | head -50; exit 1; }
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
      - name: Unit tests (no dependencies needed)
        working-directory: ${{ env.PROJ }}
        run: |
          node tests/lib.test.js
          node tests/sync.test.js

  build-windows:
    needs: test
    runs-on: windows-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Locate project
        run: |
          f=$(grep -l '"name": *"tasyir-bmd-desktop"' $(find . -name package.json -not -path '*/node_modules/*') | head -1)
          [ -n "$f" ] || { echo "::error::package.json not found"; exit 1; }
          echo "PROJ=$(dirname "$f")" >> "$GITHUB_ENV"
      - name: Install
        working-directory: ${{ env.PROJ }}
        run: npm install --no-audit --no-fund
      - name: Build installer + portable
        working-directory: ${{ env.PROJ }}
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Tasyir-Desktop-Windows
          path: ${{ env.PROJ }}/dist/*.exe
          if-no-files-found: error
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJ }}/dist/*.exe
